# Config Supabase CLI (développement local). `supabase start` applique supabase/migrations.
project_id = "multideploy"

[api]
port = 54321
schemas = ["public"]            # le schéma `app` (helpers RLS) n'est volontairement PAS exposé en API

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = false           # accès sur invitation uniquement

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
